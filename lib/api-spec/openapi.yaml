openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: qr
    description: QR lookup and activation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /qr/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
    get:
      operationId: getQrStatus
      tags: [qr]
      summary: Check a QR card's public state
      responses:
        "200":
          description: The QR card is active or ready for activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrStatus"
        "400":
          description: Invalid QR code format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Invalid, blocked, or unavailable QR card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: QR code is ambiguous in the existing card records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Supabase is not available or configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /qr/{code}/activate:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
    post:
      operationId: activateQr
      tags: [qr]
      summary: Activate a valid unactivated QR card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrActivationInput"
      responses:
        "201":
          description: QR card activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrActivationSuccess"
        "400":
          description: Invalid activation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Package claim code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Invalid, blocked, or unavailable QR card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: QR card has already been activated or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Supabase could not complete activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QrStatus:
      type: object
      properties:
        state:
          type: string
          enum: [activation_required, active]
      required: [state]
    QrActivationInput:
      type: object
      properties:
        claimCode:
          type: string
          minLength: 32
          maxLength: 32
          pattern: "^[A-Fa-f0-9]{32}$"
        ownerName:
          type: string
          minLength: 2
          maxLength: 100
        ownerPhone:
          type: string
          minLength: 10
          maxLength: 16
          pattern: "^(?:\\+?[1-9][0-9]{7,14}|[6-9][0-9]{9})$"
        vehicleMake:
          type: string
          minLength: 1
          maxLength: 80
        vehicleModel:
          type: string
          minLength: 1
          maxLength: 80
        vehicleColour:
          type: string
          minLength: 1
          maxLength: 40
        vehicleRegistration:
          type: string
          minLength: 4
          maxLength: 20
          pattern: "^[A-Za-z0-9 -]{4,20}$"
      required:
        - claimCode
        - ownerName
        - ownerPhone
        - vehicleMake
        - vehicleModel
        - vehicleColour
        - vehicleRegistration
    QrActivationSuccess:
      type: object
      properties:
        state:
          type: string
          enum: [active]
      required: [state]
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

